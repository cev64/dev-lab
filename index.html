<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dev Lab Tools</title>
<meta name="description" content="Small working tools: betting math, analytics and finance helpers.">
<link rel="stylesheet" href="shared/glass.css">
<style>
  .head{padding:20px 0 16px}
  .head .display{margin-top:4px}
  .controls{display:grid;gap:12px;margin-bottom:20px}
  .search{position:relative}
  .search .input{padding-left:42px}
  .search svg{position:absolute;left:13px;top:50%;margin-top:-10px;width:20px;height:20px;stroke:var(--ink-3);fill:none;
    stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
  .card{display:flex;flex-direction:column;gap:6px;padding:20px;color:var(--ink);text-decoration:none;min-height:132px}
  .card .desc{color:var(--ink-2);margin:0;flex:1}
  .card .meta{margin-top:6px}
  .card.enter{animation:rise .45s var(--ease) backwards;animation-delay:calc(var(--i,0) * 45ms)}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}}
  .note{padding:24px;color:var(--ink-2);margin:0}
  .note[hidden]{display:none}
  .topbar .compact{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
  .topbar .spacer{width:44px}
  #theme .ico{display:none}
  #theme[data-mode="auto"] .i-auto,#theme[data-mode="light"] .i-light,#theme[data-mode="dark"] .i-dark{display:block}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="topbar" id="bar">
  <span class="spacer" aria-hidden="true"></span>
  <span class="compact">Tools</span>
  <button class="icon-btn" id="theme" type="button" data-mode="auto" aria-label="Theme: auto">
    <svg class="ico i-auto" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    <svg class="ico i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="ico i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  </button>
</header>

<main class="page">
  <div class="head">
    <div class="micro">Dev Lab</div>
    <h1 class="display">Tools</h1>
  </div>

  <div class="controls">
    <label class="search">
      <span class="sr-only">Search tools</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="input" id="q" type="search" placeholder="Search tools" autocomplete="off">
    </label>
    <div class="chips" id="chips" role="group" aria-label="Interest area"></div>
  </div>

  <div class="grid cards" id="cards"></div>
  <p class="glass note" id="note" hidden></p>
</main>

<script>
(function () {
  var root = document.documentElement;
  var bar = document.getElementById('bar');
  var themeBtn = document.getElementById('theme');
  var qEl = document.getElementById('q');
  var chipsEl = document.getElementById('chips');
  var cardsEl = document.getElementById('cards');
  var noteEl = document.getElementById('note');
  var MODES = ['auto', 'light', 'dark'];

  /* theme */
  function getMode() {
    try { var m = localStorage.getItem('devlab-theme'); if (MODES.indexOf(m) > -1) return m; } catch (e) {}
    return 'auto';
  }
  function applyMode(m) {
    if (m === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', m);
    themeBtn.setAttribute('data-mode', m);
    themeBtn.setAttribute('aria-label', 'Theme: ' + m);
    themeBtn.title = 'Theme: ' + m;
  }
  applyMode(getMode());
  themeBtn.addEventListener('click', function () {
    var next = MODES[(MODES.indexOf(getMode()) + 1) % 3];
    try { localStorage.setItem('devlab-theme', next); } catch (e) {}
    applyMode(next);
  });

  /* top bar condense */
  function onScroll() { bar.classList.toggle('condensed', window.scrollY > 56); }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* data */
  var tools = [], area = 'All', first = true;
  var fmt;
  try { fmt = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }); } catch (e) {}
  function fmtDate(s) {
    var d = new Date(s);
    return (fmt && !isNaN(d)) ? fmt.format(d) : s;
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderChips() {
    var areas = ['All'];
    tools.forEach(function (t) { if (areas.indexOf(t.area) < 0) areas.push(t.area); });
    areas.sort(function (a, b) { return a === 'All' ? -1 : b === 'All' ? 1 : a.localeCompare(b); });
    chipsEl.textContent = '';
    areas.forEach(function (a) {
      var b = el('button', 'chip', a);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(a === area));
      b.addEventListener('click', function () { area = a; renderChips(); renderCards(); });
      chipsEl.appendChild(b);
    });
  }

  function renderCards() {
    var q = qEl.value.trim().toLowerCase();
    var list = tools.filter(function (t) {
      if (area !== 'All' && t.area !== area) return false;
      return !q || (t.name + ' ' + t.description + ' ' + t.area).toLowerCase().indexOf(q) > -1;
    });
    cardsEl.textContent = '';
    list.forEach(function (t, i) {
      var a = el('a', 'glass tap card' + (first ? ' enter' : ''));
      a.href = 'tools/' + encodeURIComponent(t.slug) + '/index.html';
      a.style.setProperty('--i', Math.min(i, 12));
      a.appendChild(el('h2', 'card-title', t.name));
      a.appendChild(el('p', 'desc', t.description));
      a.appendChild(el('div', 'meta', t.area + ' · ' + fmtDate(t.added)));
      cardsEl.appendChild(a);
    });
    first = false;
    if (!list.length && tools.length) showNote('No tools match. Try another word or area.');
    else if (!tools.length) showNote('No tools yet.');
    else noteEl.hidden = true;
  }

  function showNote(msg) { noteEl.textContent = msg; noteEl.hidden = false; }

  qEl.addEventListener('input', renderCards);

  fetch('tools/registry.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      if (!Array.isArray(data)) throw new Error('bad registry');
      tools = data.slice().sort(function (a, b) {
        return String(b.added).localeCompare(String(a.added)) || String(a.name).localeCompare(String(b.name));
      });
      renderChips();
      renderCards();
    })
    .catch(function () {
      showNote('Serve this folder (python3 -m http.server) to load the tool list.');
    });
})();
</script>
</body>
</html>
