name: Deploy
# Deploys Convex functions and the static site. Runs on every push to main and twice a day
# (after the Convex data refresh) so the free snapshot baked into the site stays current.
on:
  push:
    branches: [main]
  schedule:
    - cron: "40 9 * * *"
    - cron: "40 21 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'fieldwren' }}
      PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_CHECKOUT_URL: ${{ vars.PUBLIC_CHECKOUT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Deploy Convex functions
        if: env.CONVEX_DEPLOY_KEY != '' && github.event_name != 'schedule'
        run: npx convex deploy --yes
      - name: Make sure a data snapshot exists
        if: env.CONVEX_DEPLOY_KEY != '' && github.event_name != 'schedule'
        run: npx convex run refresh:nfl '{}' || echo "refresh failed; site will use the last snapshot"
      - name: Build site
        run: npm run build
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler@4 pages project create "$CF_PAGES_PROJECT" --production-branch main >/dev/null 2>&1 || true
          npx wrangler@4 pages deploy dist --project-name "$CF_PAGES_PROJECT" --branch main --commit-dirty=true
      - name: Smoke test live site
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/smoke-live.mjs
