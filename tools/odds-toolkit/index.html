<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odds Toolkit</title>
<meta name="description" content="Convert odds, remove the vig and size bets with EV and Kelly.">
<script>
try { var t = localStorage.getItem('devlab-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="stylesheet" href="../../shared/glass.css">
<style>
  .topbar .compact { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; }
  .topbar .spacer { width: 44px; height: 44px; }
  .topbar .icon-btn { text-decoration: none; color: var(--ink); position: relative; z-index: 1; }
  .head { padding: 8px 0 20px; }
  .head .display { margin-top: 4px; }
  .tabs { margin-bottom: 12px; }
  .seg.full { display: flex; }
  .seg.full button { flex: 1; padding: 0 8px; white-space: nowrap; }
  .tabs .seg { max-width: 460px; }
  .layout { display: grid; gap: 12px; align-items: start; }
  @media (min-width: 900px) { .layout { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } }
  .card { padding: 20px; }
  .card + .card { margin-top: 0; }
  .stack { display: grid; gap: 12px; }
  .field { display: grid; gap: 6px; }
  .field .micro { padding-left: 2px; }
  .input[aria-invalid="true"] { box-shadow: inset 0 0 0 2px var(--bad); }
  .field-grid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .field-grid .wide { grid-column: 1 / -1; }
  .hero-card { padding: 22px 20px; }
  .hero-card .hero { margin: 6px 0 2px; font-variant-numeric: tabular-nums lining-nums; overflow-wrap: anywhere; }
  .hero-card .word { font-weight: 600; font-size: 15px; }
  .rows { display: grid; gap: 12px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .row .label { color: var(--ink-2); }
  .row .val { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums lining-nums; }
  .row .val small { display: block; font-size: 13px; line-height: 18px; font-weight: 600; }
  .row .val small.neutral { color: var(--ink-3); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .group-label { margin-bottom: 8px; display: block; }
  .legs { display: grid; gap: 10px; }
  .leg { display: grid; grid-template-columns: minmax(0, 1fr) 104px; gap: 10px; }
  .leg label { display: grid; gap: 4px; }
  .res-head, .res-row { display: grid; grid-template-columns: minmax(0, 1fr) 62px 62px 66px; gap: 8px; align-items: baseline; }
  .res-head { margin-bottom: 10px; }
  .res-head span:not(:first-child) { text-align: right; }
  .res-row { padding: 6px 0; }
  .res-row .name { font-weight: 500; overflow-wrap: anywhere; }
  .res-row .num { font-size: 15px; }
  .res-row .fair { font-weight: 600; }
  @media (min-width: 600px) { .res-head, .res-row { grid-template-columns: minmax(0, 1fr) 90px 90px 90px; } .res-row .num { font-size: 16px; } }
  .res-rows { display: grid; gap: 4px; }
  .note { color: var(--ink-3); font-size: 14px; line-height: 20px; margin: 0; }
  .empty { color: var(--ink-2); margin: 0; }
  [hidden] { display: none !important; }
  .results { display: grid; gap: 12px; }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="topbar" id="topbar">
  <a class="icon-btn" href="../../index.html" aria-label="Back to hub">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <span class="compact" aria-hidden="true">Odds Toolkit</span>
  <span class="spacer" aria-hidden="true"></span>
</header>

<main class="page">
  <div class="head">
    <div class="micro">Betting math</div>
    <h1 class="display">Odds Toolkit</h1>
  </div>

  <div class="tabs">
    <div class="seg full" role="tablist" aria-label="Tool" id="tabs">
      <span class="thumb" aria-hidden="true"></span>
      <button role="tab" id="tab-convert" aria-controls="panel-convert" aria-selected="true">Convert</button>
      <button role="tab" id="tab-novig" aria-controls="panel-novig" aria-selected="false" tabindex="-1">No-vig</button>
      <button role="tab" id="tab-ev" aria-controls="panel-ev" aria-selected="false" tabindex="-1">EV &amp; Kelly</button>
    </div>
  </div>

  <!-- Convert -->
  <section id="panel-convert" role="tabpanel" aria-labelledby="tab-convert" class="layout">
    <div class="glass card stack">
      <h2 class="card-title">Odds</h2>
      <label class="field"><span class="micro">American</span>
        <input class="input" id="cv-american" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="+150"></label>
      <label class="field"><span class="micro">Decimal</span>
        <input class="input" id="cv-decimal" inputmode="decimal" autocomplete="off" spellcheck="false"></label>
      <label class="field"><span class="micro">Fractional</span>
        <input class="input" id="cv-fractional" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label class="field"><span class="micro">Implied probability, %</span>
        <input class="input" id="cv-implied" inputmode="decimal" autocomplete="off" spellcheck="false"></label>
    </div>
    <div class="results" id="cv-out" aria-live="polite"></div>
  </section>

  <!-- No-vig -->
  <section id="panel-novig" role="tabpanel" aria-labelledby="tab-novig" class="layout" hidden>
    <div class="glass card stack">
      <h2 class="card-title">Market</h2>
      <div>
        <span class="micro group-label" id="nv-count-label">Outcomes</span>
        <div class="seg" role="group" aria-labelledby="nv-count-label" id="nv-count">
          <span class="thumb" aria-hidden="true"></span>
          <button aria-pressed="true" data-v="2">2</button>
          <button aria-pressed="false" data-v="3">3</button>
          <button aria-pressed="false" data-v="4">4</button>
        </div>
      </div>
      <div>
        <span class="micro group-label" id="nv-preset-label">Examples</span>
        <div class="controls" role="group" aria-labelledby="nv-preset-label">
          <button class="chip" data-preset="spread" aria-pressed="true">Spread</button>
          <button class="chip" data-preset="soccer" aria-pressed="false">Soccer 3-way</button>
          <button class="chip" data-preset="futures" aria-pressed="false">Four-way</button>
        </div>
      </div>
      <div class="legs" id="nv-legs"></div>
      <div>
        <span class="micro group-label" id="nv-method-label">Method</span>
        <div class="seg" role="group" aria-labelledby="nv-method-label" id="nv-method">
          <span class="thumb" aria-hidden="true"></span>
          <button aria-pressed="true" data-v="proportional">Proportional</button>
          <button aria-pressed="false" data-v="power">Power</button>
        </div>
      </div>
    </div>
    <div class="results" id="nv-out" aria-live="polite"></div>
  </section>

  <!-- EV & Kelly -->
  <section id="panel-ev" role="tabpanel" aria-labelledby="tab-ev" class="layout" hidden>
    <div class="glass card stack">
      <h2 class="card-title">Bet</h2>
      <div class="field-grid">
        <label class="field"><span class="micro">Odds</span>
          <input class="input" id="ev-odds" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="−110"></label>
        <label class="field"><span class="micro">Win probability, %</span>
          <input class="input" id="ev-prob" inputmode="decimal" autocomplete="off" value="55"></label>
        <label class="field"><span class="micro">Bankroll, $</span>
          <input class="input" id="ev-bank" inputmode="decimal" autocomplete="off" value="1000"></label>
        <label class="field"><span class="micro">Stake, $</span>
          <input class="input" id="ev-stake" inputmode="decimal" autocomplete="off" value="100"></label>
        <label class="field wide"><span class="micro">Other side odds, optional</span>
          <input class="input" id="ev-other" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="−110"></label>
      </div>
      <div>
        <span class="micro group-label" id="ev-mult-label">Kelly multiplier</span>
        <div class="controls" role="group" aria-labelledby="ev-mult-label" id="ev-mult">
          <button class="chip" data-v="1" aria-pressed="false" aria-label="Full Kelly">1</button>
          <button class="chip" data-v="0.5" aria-pressed="false" aria-label="Half Kelly">1/2</button>
          <button class="chip" data-v="0.25" aria-pressed="true" aria-label="Quarter Kelly">1/4</button>
        </div>
      </div>
    </div>
    <div class="results" id="ev-out" aria-live="polite"></div>
  </section>
</main>

<script src="odds.js"></script>
<script>
(function () {
  'use strict';
  var O = window.Odds;
  var MINUS = '−';
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- tiny DOM + format helpers ---------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }
  function sign(x) { return x > 0 ? '+' : x < 0 ? MINUS : ''; }
  function pct(x, d) { return (x * 100).toFixed(d == null ? 2 : d) + '%'; }
  function pts(x) { var r = Math.round(x * 10000) / 100; return sign(r) + Math.abs(r).toFixed(2) + ' pts'; }
  function num2(x) { return Math.abs(x).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function money(x) { return '$' + num2(x); }
  function smoney(x) { var r = Math.round(x * 100) / 100; return sign(r) + '$' + num2(r); }
  function dec(x) { return (Math.round(x * 1000) / 1000).toFixed(3).replace(/0$/, ''); }
  function tone(x) { return x > 0.00005 ? 'good' : x < -0.00005 ? 'bad' : 'neutral'; }
  function row(label, value, word, cls) {
    var r = el('div', 'row');
    r.appendChild(el('span', 'label', label));
    var v = el('span', 'val', value);
    if (word) v.appendChild(el('small', cls || 'neutral', word));
    r.appendChild(v);
    return r;
  }
  function glassCard(extra) { return el('div', 'glass card ' + (extra || '')); }
  function message(text) {
    var c = glassCard();
    c.appendChild(el('p', 'empty', text));
    return c;
  }

  /* ---------- segmented control with sliding thumb ---------- */
  var segs = [];
  function placeThumb(seg, animate) {
    var thumb = seg.querySelector('.thumb');
    var btn = seg.querySelector('button[aria-pressed="true"],button[aria-selected="true"]');
    if (!btn || !btn.offsetWidth) return;
    if (!animate) thumb.style.transition = 'none';
    thumb.style.width = btn.offsetWidth + 'px';
    thumb.style.transform = 'translateX(' + (btn.offsetLeft - 3) + 'px)';
    if (!animate) { void thumb.offsetWidth; thumb.style.transition = ''; }
  }
  function mountSeg(seg, attr, onSelect) {
    var btns = Array.prototype.slice.call(seg.querySelectorAll('button'));
    segs.push(seg);
    function select(btn, focus) {
      btns.forEach(function (b) {
        var on = b === btn;
        b.setAttribute(attr, on ? 'true' : 'false');
        if (attr === 'aria-selected') b.tabIndex = on ? 0 : -1;
      });
      placeThumb(seg, true);
      if (focus) btn.focus();
      onSelect(btn);
    }
    btns.forEach(function (b, i) {
      b.addEventListener('click', function () { select(b); });
      if (attr === 'aria-selected') b.addEventListener('keydown', function (e) {
        var j = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1 : e.key === 'Home' ? 0 : e.key === 'End' ? btns.length - 1 : -1;
        if (j < 0) return;
        e.preventDefault();
        select(btns[(j + btns.length) % btns.length], true);
      });
    });
    return select;
  }
  function refreshThumbs() { segs.forEach(function (s) { if (s.offsetParent) placeThumb(s, false); }); }

  /* ---------- Convert ---------- */
  var cvFields = ['american', 'decimal', 'fractional', 'implied'];
  var cvOut = $('cv-out');
  function convertFrom(src) {
    var input = $('cv-' + src);
    var raw = input.value;
    var d = O.parseToDecimal(raw, src);
    cvFields.forEach(function (f) { $('cv-' + f).setAttribute('aria-invalid', 'false'); });
    var info = d ? O.describe(d) : null;
    if (info) {
      if (src !== 'american') $('cv-american').value = O.formatAmerican(info.american);
      if (src !== 'decimal') $('cv-decimal').value = dec(info.decimal);
      if (src !== 'fractional') $('cv-fractional').value = info.fractional;
      if (src !== 'implied') $('cv-implied').value = (info.implied * 100).toFixed(2);
    } else {
      cvFields.forEach(function (f) { if (f !== src) $('cv-' + f).value = ''; });
      if (raw.trim()) input.setAttribute('aria-invalid', 'true');
    }
    clear(cvOut);
    if (!info) {
      cvOut.appendChild(message(raw.trim() ? 'Not a valid price in this format.' : 'Enter odds in any one format.'));
      return;
    }
    var hero = glassCard('hero-card');
    hero.appendChild(el('div', 'micro', 'Implied probability'));
    hero.appendChild(el('div', 'hero', pct(info.implied)));
    hero.appendChild(el('div', 'meta', 'Break-even win rate'));
    cvOut.appendChild(hero);
    var more = glassCard('rows');
    more.appendChild(row('Profit on $100', money((info.decimal - 1) * 100)));
    more.appendChild(row('Stake to win $100', money(100 / (info.decimal - 1))));
    more.appendChild(row('Payout on $100', money(info.decimal * 100)));
    cvOut.appendChild(more);
  }
  cvFields.forEach(function (f) { $('cv-' + f).addEventListener('input', function () { convertFrom(f); }); });

  /* ---------- No-vig ---------- */
  var PRESETS = {
    spread: { n: 2, names: ['Chiefs ' + MINUS + '3.5', 'Raiders +3.5'], odds: [MINUS + '110', MINUS + '110'] },
    soccer: { n: 3, names: ['Home', 'Draw', 'Away'], odds: ['+120', '+230', '+240'] },
    futures: { n: 4, names: ['Team A', 'Team B', 'Team C', 'Team D'], odds: ['+150', '+220', '+350', '+500'] }
  };
  var nv = { n: 2, names: ['', '', '', ''], odds: ['', '', '', ''], method: 'proportional' };
  var nvLegs = $('nv-legs'), nvOut = $('nv-out');
  var legInputs = [];

  function buildLegs() {
    for (var i = 0; i < 4; i++) (function (i) {
      var wrap = el('div', 'leg');
      var l1 = el('label'); l1.appendChild(el('span', 'micro', 'Outcome ' + (i + 1)));
      var name = el('input', 'input'); name.type = 'text'; name.autocomplete = 'off'; name.placeholder = 'Name';
      name.setAttribute('aria-label', 'Outcome ' + (i + 1) + ' name');
      l1.appendChild(name);
      var l2 = el('label'); l2.appendChild(el('span', 'micro', 'Odds'));
      var odds = el('input', 'input'); odds.type = 'text'; odds.setAttribute('inputmode', 'text'); odds.autocomplete = 'off';
      odds.setAttribute('autocapitalize', 'off'); odds.spellcheck = false; odds.placeholder = '+150';
      odds.setAttribute('aria-label', 'Outcome ' + (i + 1) + ' odds');
      l2.appendChild(odds);
      wrap.appendChild(l1); wrap.appendChild(l2);
      name.addEventListener('input', function () { nv.names[i] = name.value; setPreset(null); renderNv(); });
      odds.addEventListener('input', function () { nv.odds[i] = odds.value; setPreset(null); renderNv(); });
      nvLegs.appendChild(wrap);
      legInputs.push({ wrap: wrap, name: name, odds: odds });
    })(i);
  }
  var presetBtns = Array.prototype.slice.call(document.querySelectorAll('[data-preset]'));
  function setPreset(key) {
    presetBtns.forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-preset') === key ? 'true' : 'false'); });
  }
  function syncLegs() {
    legInputs.forEach(function (l, i) {
      l.wrap.hidden = i >= nv.n;
      if (l.name.value !== nv.names[i]) l.name.value = nv.names[i];
      if (l.odds.value !== nv.odds[i]) l.odds.value = nv.odds[i];
    });
  }
  function renderNv() {
    clear(nvOut);
    var decs = [], bad = false, empty = false;
    for (var i = 0; i < nv.n; i++) {
      var raw = nv.odds[i].trim();
      var d = O.parseOdds(raw);
      legInputs[i].odds.setAttribute('aria-invalid', raw && d === null ? 'true' : 'false');
      if (!raw) empty = true; else if (d === null) bad = true;
      decs.push(d);
    }
    if (bad || empty) {
      nvOut.appendChild(message(bad ? 'One of the prices is not valid.' : 'Enter odds for every outcome.'));
      return;
    }
    var r = O.removeVig(decs, nv.method);
    var hero = glassCard('hero-card');
    hero.appendChild(el('div', 'micro', 'Overround'));
    hero.appendChild(el('div', 'hero', pct(r.overround)));
    hero.appendChild(el('div', 'meta', 'Total implied ' + pct(r.overround + 1) + ', hold ' + pct(r.hold)));
    nvOut.appendChild(hero);

    var card = glassCard();
    var head = el('div', 'res-head micro');
    ['Outcome', 'Implied', 'Fair', 'Fair odds'].forEach(function (t) { head.appendChild(el('span', null, t)); });
    card.appendChild(head);
    var rows = el('div', 'res-rows');
    for (var j = 0; j < nv.n; j++) {
      var rr = el('div', 'res-row');
      rr.appendChild(el('span', 'name', nv.names[j].trim() || 'Outcome ' + (j + 1)));
      rr.appendChild(el('span', 'num', pct(r.implied[j])));
      rr.appendChild(el('span', 'num fair', pct(r.fair[j])));
      rr.appendChild(el('span', 'num', O.formatAmerican(r.fairAmerican[j]) + ' / ' + dec(r.fairDecimal[j])));
      rows.appendChild(rr);
    }
    card.appendChild(rows);
    nvOut.appendChild(card);
    nvOut.appendChild(el('p', 'note', r.method === 'power'
      ? 'Power method: raises each implied probability to one exponent so they sum to 100%.'
      : 'Proportional method: each implied probability divided by the total.'));
  }
  function applyPreset(key) {
    var p = PRESETS[key];
    nv.n = p.n; nv.names = p.names.concat(['', '', '', '']).slice(0, 4); nv.odds = p.odds.concat(['', '', '', '']).slice(0, 4);
    setPreset(key); selectCount(nv.n); syncLegs(); renderNv();
  }
  presetBtns.forEach(function (b) { b.addEventListener('click', function () { applyPreset(b.getAttribute('data-preset')); }); });

  /* ---------- EV & Kelly ---------- */
  var evOut = $('ev-out');
  var evMult = 0.25;
  var MULT_WORD = { '1': 'Full Kelly', '0.5': 'Half Kelly', '0.25': 'Quarter Kelly' };
  function numVal(id) {
    var s = $(id).value.trim().replace(/[$,%\s]/g, '');
    return /^\d+(\.\d+)?$/.test(s) ? parseFloat(s) : null;
  }
  function renderEv() {
    clear(evOut);
    var d = O.parseOdds($('ev-odds').value);
    var pp = numVal('ev-prob'), p = pp === null ? null : pp / 100;
    var bank = numVal('ev-bank'), stake = numVal('ev-stake');
    $('ev-odds').setAttribute('aria-invalid', $('ev-odds').value.trim() && d === null ? 'true' : 'false');
    $('ev-prob').setAttribute('aria-invalid', pp !== null && !(p > 0 && p < 1) || ($('ev-prob').value.trim() && pp === null) ? 'true' : 'false');
    if (d === null) { evOut.appendChild(message('Enter valid odds, for example ' + MINUS + '110, 1.91 or 10/11.')); return; }
    if (p === null || !(p > 0 && p < 1)) { evOut.appendChild(message('Win probability must be between 0 and 100%.')); return; }
    if (bank === null) { evOut.appendChild(message('Enter a bankroll.')); return; }
    if (stake === null) stake = 0;

    var frac = O.kellyFraction(d, p, evMult);
    var kstake = bank * frac;
    var hero = glassCard('hero-card');
    hero.appendChild(el('div', 'micro', 'Recommended stake'));
    hero.appendChild(el('div', 'hero', money(kstake)));
    var word = frac > 0 ? 'Bet' : 'No bet';
    var sub = el('div', 'meta');
    sub.appendChild(el('span', 'word ' + (frac > 0 ? 'good' : 'bad'), word));
    sub.appendChild(document.createTextNode(frac > 0
      ? ' · ' + MULT_WORD[String(evMult)] + ', ' + pct(frac) + ' of bankroll'
      : ' · The price does not beat your estimate'));
    hero.appendChild(sub);
    evOut.appendChild(hero);

    var ev = O.expectedValue(stake, d, p);
    var be = 1 / d;
    var edgePrice = p - be;
    var rows = glassCard('rows');
    var evT = tone(ev / (stake || 1));
    rows.appendChild(row('EV on ' + money(stake), smoney(ev), evT === 'good' ? 'Positive' : evT === 'bad' ? 'Negative' : 'Break-even', evT));
    var roi = O.roi(d, p);
    rows.appendChild(row('Return per $1 staked', sign(Math.round(roi * 10000) / 10000) + Math.abs(roi * 100).toFixed(2) + '%'));
    var eT = tone(edgePrice);
    rows.appendChild(row('Edge vs price', pts(edgePrice), eT === 'good' ? 'Edge' : eT === 'bad' ? 'No edge' : 'Even', eT));
    var od = O.parseOdds($('ev-other').value);
    if (od !== null) {
      var fv = O.removeVig([d, od]);
      var edgeFair = O.edgeVsFair(p, fv.fair[0]);
      var fT = tone(edgeFair);
      rows.appendChild(row('Edge vs no-vig fair ' + pct(fv.fair[0]), pts(edgeFair), fT === 'good' ? 'Edge' : fT === 'bad' ? 'No edge' : 'Even', fT));
    }
    rows.appendChild(row('Break-even win rate', pct(be)));
    rows.appendChild(row('Full Kelly', pct(O.kellyFraction(d, p, 1)) + ' · ' + money(bank * O.kellyFraction(d, p, 1))));
    evOut.appendChild(rows);
  }
  ['ev-odds', 'ev-prob', 'ev-bank', 'ev-stake', 'ev-other'].forEach(function (id) { $(id).addEventListener('input', renderEv); });
  Array.prototype.forEach.call(document.querySelectorAll('#ev-mult .chip'), function (b) {
    b.addEventListener('click', function () {
      evMult = parseFloat(b.getAttribute('data-v'));
      Array.prototype.forEach.call(document.querySelectorAll('#ev-mult .chip'), function (c) { c.setAttribute('aria-pressed', c === b ? 'true' : 'false'); });
      renderEv();
    });
  });

  /* ---------- tabs ---------- */
  var panels = { 'tab-convert': $('panel-convert'), 'tab-novig': $('panel-novig'), 'tab-ev': $('panel-ev') };
  mountSeg($('tabs'), 'aria-selected', function (btn) {
    Object.keys(panels).forEach(function (k) { panels[k].hidden = k !== btn.id; });
    refreshThumbs();
  });
  var selectCount = (function () {
    var seg = $('nv-count');
    var sel = mountSeg(seg, 'aria-pressed', function (btn) {
      nv.n = parseInt(btn.getAttribute('data-v'), 10);
      setPreset(null);
      syncLegs(); renderNv();
    });
    return function (n) {
      var b = seg.querySelector('[data-v="' + n + '"]');
      Array.prototype.forEach.call(seg.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      placeThumb(seg, true);
    };
  })();
  mountSeg($('nv-method'), 'aria-pressed', function (btn) { nv.method = btn.getAttribute('data-v'); renderNv(); });

  /* ---------- top bar condense ---------- */
  var topbar = $('topbar');
  function onScroll() { topbar.classList.toggle('condensed', window.scrollY > 56); }
  window.addEventListener('scroll', onScroll, { passive: true });

  /* ---------- init ---------- */
  buildLegs();
  applyPreset('spread');
  convertFrom('american');
  renderEv();
  onScroll();
  window.addEventListener('resize', refreshThumbs);
  if (window.ResizeObserver) new ResizeObserver(refreshThumbs).observe(document.body);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refreshThumbs);
  window.addEventListener('load', refreshThumbs);
  requestAnimationFrame(refreshThumbs);
})();
</script>
</body>
</html>
